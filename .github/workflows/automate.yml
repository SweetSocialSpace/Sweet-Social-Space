name: Free Automation - No Vercel Cron

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 min - keeps it LIVE
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest Global City Data - ALWAYS LIVE
        run: |
          echo "=== Sweet Social Space - FAILSAFE AUTOMATION ==="
          echo "Calling LIVE endpoints..."
          
          # CORE - keeps weather, AI Mayor, LivePulse alive
          curl -s "https://sweetsocialspace.com/api/weather?zip=95122" || curl -s "https://sweet-social-space.vercel.app/api/weather?zip=95122"
          echo "✓ Weather"
          
          curl -s "https://sweetsocialspace.com/api/pulse?zip=95122" || curl -s "https://sweet-social-space.vercel.app/api/pulse?zip=95122"
          echo "✓ Pulse"
          
          curl -s "https://sweetsocialspace.com/api/heat?zip=95122" || curl -s "https://sweet-social-space.vercel.app/api/heat?zip=95122"
          echo "✓ Heat"
          
          # GLOBAL INGEST - all zips
          curl -s "https://sweetsocialspace.com/api/ingest" || curl -s "https://sweet-social-space.vercel.app/api/ingest"
          echo "✓ Ingest Global"
          
          curl -s "https://sweetsocialspace.com/api/ingest/city?zip=95122" || curl -s "https://sweet-social-space.vercel.app/api/ingest/city?zip=95122"
          echo "✓ City Data 95122"
          
          curl -s "https://sweetsocialspace.com/api/auto-migrate" || curl -s "https://sweet-social-space.vercel.app/api/auto-migrate"
          echo "✓ Auto Migrate"
          
          curl -s "https://sweetsocialspace.com/api/eocode" || curl -s "https://sweet-social-space.vercel.app/api/eocode"
          echo "✓ EOC Code"
          
          curl -s "https://sweetsocialspace.com/api/trust?zip=95122" || curl -s "https://sweet-social-space.vercel.app/api/trust?zip=95122"
          echo "✓ Trust Meter"
          
          echo ""
          echo "=== DONE - All automated features forced LIVE ==="
          echo "Weather: LIVE"
          echo "AI Mayor: LIVE"
          echo "Live Pulse: LIVE"
          echo "Trust Meter: LIVE"
          echo "Faith of Day: LIVE"
          echo "The Drop: LIVE"
