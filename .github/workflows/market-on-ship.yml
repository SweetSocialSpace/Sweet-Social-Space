name: Market On Ship
on:
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'translations/**']
  workflow_dispatch:

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show what changed
        run: git diff HEAD~1 --name-only | head -20

      # Replace your java block with something that actually markets:
      - name: Ping search engines that site updated
        run: |
          curl "https://www.google.com/ping?sitemap=https://sweetsocialspace.com/sitemap.xml" || true
          curl "https://www.bing.com/ping?sitemap=https://sweetsocialspace.com/sitemap.xml" || true
          echo "✓ Google & Bing know you updated Faith fix"

      - name: Create release note that people can find
        run: |
          echo "Updated at $(date): $(git log -1 --pretty=%B)" > public/whats-new.txt
